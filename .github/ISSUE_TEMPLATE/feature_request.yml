name: Feature request
description: Suggest a focused improvement to PicKart.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This proposal can fit the current HTML, CSS, and JavaScript architecture.
          required: false
        - label: I am willing to help test or implement this change.
          required: false