name: Update README Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update README timestamp
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +"%Y-%m-%d %H:%M UTC")"
          TIMESTAMP_LINE="Last updated: $DATE"

          if [[ -f README.md ]] && grep -q "^Last updated:" README.md; then
            sed -i "s/^Last updated:.*/$TIMESTAMP_LINE/" README.md
          elif [[ -f README.md ]]; then
            printf "\n%s\n" "$TIMESTAMP_LINE" >> README.md
          else
            printf "# Image Search Website\n\n%s\n" "$TIMESTAMP_LINE" > README.md
          fi

      - name: Commit README update when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brajesh Kumar"
          git config user.email "brajesh31@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "chore: update README timestamp"
          git push
