<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PicKart helps you discover photographs from Unsplash by searching for topics, places, and ideas."
    />
    <meta name="theme-color" content="#171326" />
    <title>PicKart | Image Search</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" href="./shape.png" />
    <script src="./config.js"></script>
    <script src="./script.js" defer></script>
  </head>

  <body>
    <img
      src="https://wallpapercave.com/wp/wp2905430.jpg"
      alt=""
      class="background-image"
      aria-hidden="true"
    />

    <main>
      <section class="container-box" aria-labelledby="page-title">
        <div class="container glass">
          <div class="headline">
            <div class="image-icon" aria-hidden="true">
              <i class="fa-regular fa-image"></i>
            </div>
            <h1 id="page-title">PicKart Image Search</h1>
          </div>

          <p class="intro">
            Find photographs for your ideas, projects, and inspiration.
          </p>

          <form class="search-box" role="search">
            <label class="visually-hidden" for="search-input">Search images</label>
            <input
              type="search"
              id="search-input"
              name="query"
              placeholder="Search for images..."
              autocomplete="off"
              maxlength="120"
              required
            />
            <button id="search-button" type="submit">Search</button>
          </form>
          <p id="search-status" class="search-status" role="status" aria-live="polite">
            Search for a topic to discover photos from Unsplash.
          </p>
        </div>
      </section>

      <section class="gallery-section" aria-label="Image search results">
        <div class="search-results" aria-live="polite"></div>
        <button id="show-more-button" type="button" hidden>Show More</button>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Photos are provided by
        <a href="https://unsplash.com/" target="_blank" rel="noopener noreferrer">Unsplash</a>.
        Please follow the Unsplash API guidelines when using this project.
      </p>
    </footer>
  </body>
</html>
